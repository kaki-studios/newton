name: Deploy Newton 

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  actions: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: kaki-studios/newton

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}
      image_ref: ${{ steps.vars.outputs.image_ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set image variables
        id: vars
        run: |
          IMAGE_TAG="sha-${GITHUB_SHA}"
          IMAGE_REF="${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}"
          echo "image_tag=${IMAGE_TAG}" >> "${GITHUB_OUTPUT}"
          echo "image_ref=${IMAGE_REF}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.vars.outputs.image_ref }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ secrets.VPS_HOST }}

      - name: Upload stack file
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: "docker-stack.yml"
          target: "/tmp"

      - name: Deploy stack on VPS
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
          IMAGE_REF: ${{ needs.build-and-push.outputs.image_ref }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: IMAGE_TAG,IMAGE_REF,GHCR_USERNAME,GHCR_TOKEN
          script_stop: true
          script: |
            set -euo pipefail
            if [ -z "${GHCR_USERNAME}" ] || [ -z "${GHCR_TOKEN}" ]; then
              echo "GHCR_USERNAME or GHCR_TOKEN is missing in GitHub secrets" >&2
              exit 1
            fi

            sudo mkdir -p ~/newton
            sudo mv /tmp/docker-stack.yml ~/newton/docker-stack.yml
            sudo chown root:root ~/newton/docker-stack.yml
            sudo chmod 644 ~/newton/docker-stack.yml

            echo "${GHCR_TOKEN}" | sudo docker login ghcr.io -u "${GHCR_USERNAME}" --password-stdin
            sudo docker pull "${IMAGE_REF}"

            cd ~/newton
            sudo IMAGE_TAG="${IMAGE_TAG}" docker stack deploy --with-registry-auth -c docker-stack.yml newton

            deadline=$(( $(date +%s) + 240 ))
            while [ "$(date +%s)" -lt "${deadline}" ]; do
              replicas="$(sudo docker service ls --format '{{.Name}} {{.Replicas}}' | awk '$1=="newton_newton" {print $2}')"
              current_state="$(sudo docker service ps newton_newton --filter desired-state=running --format '{{.CurrentState}}' | head -n1 || true)"
              update_state="$(sudo docker service inspect newton_newton --format '{{if .UpdateStatus}}{{.UpdateStatus.State}}{{end}}')"

              if [ "${replicas}" = "1/1" ] && echo "${current_state}" | grep -q '^Running'; then
                break
              fi

              if [ "${update_state}" = "paused" ] || [ "${update_state}" = "rollback_started" ] || [ "${update_state}" = "rollback_paused" ]; then
                echo "Swarm update failed with state: ${update_state}" >&2
                sudo docker service ps newton_newton --no-trunc
                exit 1
              fi

              sleep 5
            done

            replicas="$(sudo docker service ls --format '{{.Name}} {{.Replicas}}' | awk '$1=="newton_newton" {print $2}')"
            current_state="$(sudo docker service ps newton_newton --filter desired-state=running --format '{{.CurrentState}}' | head -n1 || true)"
            if [ "${replicas}" != "1/1" ] || ! echo "${current_state}" | grep -q '^Running'; then
              echo "Rollout timed out. Replicas=${replicas:-unknown}, state=${current_state:-unknown}" >&2
              sudo docker service ls
              sudo docker service ps newton_newton --no-trunc
              exit 1
            fi

            sudo docker service ls
            sudo docker service ps newton_newton --no-trunc
