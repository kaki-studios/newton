version: "3.9"

# One origin, one binary. Traefik terminates TLS and forwards; the Go server serves the static app
# and the API from the same host, which is what makes `__Host-` cookies and a buffering-free SSE
# stream possible. nginx is gone on purpose: a second proxy hop between the browser and the stream
# is exactly the thing that used to buffer it.
#
# Litestream replicates the SQLite file to object storage. It wraps the app with `exec`, so a fresh
# node or an emptied volume restores before the server opens its listener.

services:
  newton:
    image: ghcr.io/kaki-studios/newton:${IMAGE_TAG:-main}
    networks:
      - traefik-public # see https://github.com/kaki-studios/traefik-config
    volumes:
      - newton_data:/data
    environment:
      - BASE_URL=https://newton.kaarlo.dev
      - CHAT_ENABLED=${CHAT_ENABLED:-false}
      - PROVIDER=${PROVIDER:-fake}
      - MODEL=${MODEL:-}
      # Per-user daily cap and the per-conversation repair budget. Both are spend controls.
      - DAILY_GENERATIONS=${DAILY_GENERATIONS:-10}
      - MAX_CONVERSATION_TURNS=${MAX_CONVERSATION_TURNS:-6}
      # Install-wide daily cost ceiling in micro-units; 0 means no ceiling.
      - DAILY_COST_MICROS=${DAILY_COST_MICROS:-0}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      # Secrets are files below, never env variables: `docker inspect` shows env to anyone who can
      # run it, and a Swarm secret is only readable inside the container
      - GITHUB_CLIENT_ID_FILE=/run/secrets/github_client_id
      - GITHUB_CLIENT_SECRET_FILE=/run/secrets/github_client_secret
      - SESSION_KEY_FILE=/run/secrets/session_key
      # - PROVIDER_API_KEY_FILE=/run/secrets/provider_api_key     
    secrets:
      - github_client_id
      - github_client_secret
      - session_key
      # - provider_api_key
    healthcheck:
      # distroless has no shell, so the binary checks itself. Swarm's update_config rolls back when
      # this reports unhealthy.
      test: ["CMD", "/app/newton", "-healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    deploy:
      labels:
        - "traefik.enable=true"
        - "traefik.http.services.newton.loadbalancer.server.port=8080"
        - "traefik.http.routers.newton.rule=Host(`newton.kaarlo.dev`)"
        - "traefik.http.routers.newton.entrypoints=websecure"
        - "traefik.http.routers.newton.tls.certresolver=myresolver"
      # The volume must not move between nodes, and SQLite has one writer. Revisit only with
      # evidence (multiple writers, read replicas, or wanting psql/logical replication).
      replicas: 1
      placement:
        constraints: [node.role == manager]
      update_config:
        order: stop-first
        failure_action: rollback
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3

  litestream:
    image: litestream/litestream:0.5
    # `replicate` with an `exec:` entry restores the database if it is missing, waits for WAL
    # recovery, starts the app, and stops it cleanly when the app exits. The app itself is launched
    # by Litestream, not by the orchestration, which is what makes "restore before listening" true.
    command: ["replicate", "-config", "/etc/litestream.yml"]
    volumes:
      - newton_data:/data
      - ./litestream.yml:/etc/litestream.yml:ro
    environment:
      - LITESTREAM_S3_SECRET_FILE=/run/secrets/litestream_credentials
    secrets:
      - litestream_credentials
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3

networks:
  traefik-public:
    external: true

volumes:
  newton_data:

secrets:
  github_client_id:
    external: true
  github_client_secret:
    external: true
  session_key:
    external: true
  provider_api_key:
    external: true
  litestream_credentials:
    external: true
