# Litestream configuration for the `litestream` sidecar in docker-stack.yml, mounted at
# /etc/litestream.yml. Replicates the SQLite file on the shared `newton_data` volume to Cloudflare R2.
#
# Credentials are not here: the sidecar reads them from Swarm secrets into
# LITESTREAM_ACCESS_KEY_ID / LITESTREAM_SECRET_ACCESS_KEY, which Litestream picks up itself.
#
# Restores are manual (Swarm cannot start the sidecar before the app, and the app would create an
# empty database first). With both services scaled to 0 and the old db/-wal/-shm files removed:
#
#   docker run --rm --user 65532:65532 -e LITESTREAM_ACCESS_KEY_ID=... -e LITESTREAM_SECRET_ACCESS_KEY=... \
#     -v newton_newton_data:/data -v ~/newton/litestream.yml:/etc/litestream.yml:ro \
#     litestream/litestream:0.5.18 restore -config /etc/litestream.yml /data/newton.db
#
# Drill it once BEFORE it is needed, restoring with `-o /out/newton.db` into a scratch bind mount.
#
# `_litestream_*` tables appearing in the source database are expected. Never drop them.

dbs:
  - path: /data/newton.db
    replica:
      type: s3
      bucket: newton-backup
      path: newton
      # Not a secret: the account id is on the R2 overview page in the Cloudflare dashboard.
      endpoint: https://893d3b287242e180192b69f8ee0c79b5.r2.cloudflarestorage.com
      region: auto
